<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px;max-width:420px;margin:auto">
  <style>
    h2 { color: #2adb1a; }
    #search { width:100%; padding:10px 14px; font-size:16px;
      border:2px solid #1adb27; border-radius:10px; margin-bottom:14px; }
    .student { padding:10px 14px; margin-bottom:6px; background:#f0f4ff;
      border-radius:8px; border:1px solid #c8d4f0; font-size:15px; }
    mark { background: #46d9e4; border-radius: 3px; }
    #no-results { display:none; color:#9ca3af; text-align:center; padding:20px; }
  </style>

  <h2>Student Search</h2>
  <input id="search" type="text" placeholder="Search students...">
  <div id="student-list">
    <div class="student" data-name="Sushant Neupane">Sushant Neupane — Web Programming</div>
    <div class="student" data-name="Sureash Tamang">Sureash Tamang — Database</div>
    <div class="student" data-name="Iman Tullu">Iman Tullu — Software Engineering</div>
    <div class="student" data-name="Bishal Bohora">Bishal Bohora — Artificial Intelligence</div>
    <div class="student" data-name="Ram Dhakal">Ram Dhakal — IT</div>
    <div class="student" data-name="Anish magar">Anish magar — Web Programming</div>
  </div>
  <p id="no-results">No students found.</p>

  <script>
   const searchInp = document.querySelector('#search');
const students = document.querySelectorAll('.student');
const noResults = document.querySelector('#no-results');

searchInp.addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase();
  let visible = 0;
  students.forEach(s => {
    const name = s.dataset.name.toLowerCase();
    if (name.includes(term)) {
      s.style.display = '';
      visible++;
      // Bonus: highlight match
      if (term) {
        const rx = new RegExp(`(${term})`, 'gi');
        s.innerHTML = s.dataset.name.replace(rx, '<mark>$1</mark>')
          + ' — ' + s.textContent.split('—')[1].trim();
      } else {
        s.textContent = s.dataset.name + ' — '
          + s.textContent.split('—')[1].trim();
      }
    } else {
      s.style.display = 'none';
    }
  });
  noResults.style.display = visible === 0 ? 'block' : 'none';
});
  </script>
</body></html>

<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:24px;display:flex;justify-content:center">
  <style>
    .card {
      padding: 24px; border-radius: 16px; width: 260px;
      background: #f0f4ff; border: 2px solid #dca159;
      text-align: center; transition: all 0.3s;
    }
    .card.dark {
      background: #1f1c1d; border-color: #ec818a;
      color: white;
    }
    .avatar {
      width: 70px; height: 70px; border-radius: 50%;
      background: #611218; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 12px;
    }
    button { padding: 8px 20px; border-radius: 20px; cursor: pointer; border: none; margin-top: 14px; font-weight: bold; }
  </style>

  <div id="card" class="card">
    <div class="avatar">👩‍💻</div>
    <h2>Sushant Neupane</h2>
    <p>Web Programming Student</p>
    <button id="toggle-btn">🌙 Dark Mode</button>
  </div>

  <script>
   const card = document.querySelector('#card');
const btn = document.querySelector('#toggle-btn');

btn.addEventListener('click', () => {
  card.classList.toggle('dark');
  if (card.classList.contains('dark')) {
    btn.textContent = '☀️ Light Mode';
  } else {
    btn.textContent = '🌙 Dark Mode';
  }
});
  </script>
</body></html>

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoTrack - Market Dashboard</title>

<style>
:root {
    --background: #f1f5f9;
    --surface: #ffffff;
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --text: #1e293b;
    --muted: #64748b;
    --green: #059669;
    --red: #e11d48;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    padding: 35px 20px;
}

.dashboard {
    max-width: 850px;
    margin: auto;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 30px;
}

.heading small {
    color: var(--primary);
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
}

h1 {
    font-size: 2rem;
    margin-top: 8px;
}

.heading p {
    color: var(--muted);
    margin-top: 7px;
}

#refreshBtn {
    padding: 12px 22px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#refreshBtn:hover {
    background: #3730a3;
}

#refreshBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.section-title {
    margin-bottom: 15px;
    font-size: 18px;
}

.market-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
}

.market-card {
    background: var(--surface);
    padding: 22px;
    border-radius: 15px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    transition: transform 0.2s, box-shadow 0.2s;
}

.market-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.coin-symbol {
    background: var(--primary-light);
    color: var(--primary);
    padding: 9px 11px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: bold;
}

.coin-name {
    font-size: 17px;
    font-weight: bold;
    text-transform: capitalize;
}

.price-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
}

.coin-price {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.change {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: bold;
}

.positive {
    background: #d1fae5;
    color: var(--green);
}

.negative {
    background: #ffe4e6;
    color: var(--red);
}

#status {
    text-align: center;
    color: var(--muted);
    padding: 35px 15px;
    background: var(--surface);
    border-radius: 12px;
    margin-bottom: 18px;
}

@media(max-width: 500px) {
    body {
        padding: 22px 14px;
    }

    h1 {
        font-size: 1.6rem;
    }

    .heading {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<main class="dashboard">

    <header class="heading">
        <div>
            <small>Financial Overview</small>
            <h1>📊 CryptoTrack</h1>
            <p>Explore cryptocurrency prices and daily market changes.</p>
        </div>

        <button id="refreshBtn">↻ Refresh Prices</button>
    </header>

    <h2 class="section-title">Market Overview</h2>

    <p id="status" aria-live="polite">Loading market information...</p>

    <section id="marketGrid" class="market-grid"></section>

</main>

<script>
const coinList = [
    { id: "bitcoin", symbol: "BTC" },
    { id: "ethereum", symbol: "ETH" },
    { id: "solana", symbol: "SOL" },
    { id: "ripple", symbol: "XRP" },
    { id: "cardano", symbol: "ADA" }
];

const marketGrid = document.getElementById("marketGrid");
const statusMessage = document.getElementById("status");
const refreshButton = document.getElementById("refreshBtn");

async function updateMarket() {
    refreshButton.disabled = true;
    refreshButton.textContent = "Updating...";
    statusMessage.hidden = false;
    statusMessage.textContent = "Fetching the latest prices...";
    marketGrid.replaceChildren();

    try {
        const coinIds = coinList.map(coin => coin.id).join(",");

        const apiURL =
            `https://api.coingecko.com/api/v3/simple/price?ids=${coinIds}&vs_currencies=usd&include_24hr_change=true`;

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("Unable to fetch market data.");
        }

        const marketData = await response.json();

        let displayed = 0;

        coinList.forEach(coin => {
            const details = marketData[coin.id];

            if (!details || details.usd == null) return;

            const currentPrice = Number(details.usd);
            const dailyChange = Number(details.usd_24h_change) || 0;
            const increased = dailyChange >= 0;

            const card = document.createElement("article");
            card.className = "market-card";

            const top = document.createElement("div");
            top.className = "card-top";

            const name = document.createElement("span");
            name.className = "coin-name";
            name.textContent =
                coin.id.charAt(0).toUpperCase() + coin.id.slice(1);

            const symbol = document.createElement("span");
            symbol.className = "coin-symbol";
            symbol.textContent = coin.symbol;

            top.append(name, symbol);

            const label = document.createElement("p");
            label.className = "price-label";
            label.textContent = "Current price (USD)";

            const price = document.createElement("div");
            price.className = "coin-price";
            price.textContent = "$" + currentPrice.toLocaleString(
                "en-US",
                { minimumFractionDigits: 2, maximumFractionDigits: 2 }
            );

            const badge = document.createElement("span");
            badge.className = `change ${increased ? "positive" : "negative"}`;

            badge.textContent =
                `${increased ? "▲" : "▼"} ${Math.abs(dailyChange).toFixed(2)}%`;

            card.append(top, label, price, badge);
            marketGrid.appendChild(card);

            displayed++;
        });

        statusMessage.textContent = displayed > 0
            ? `✓ Successfully loaded ${displayed} cryptocurrencies.`
            : "No market information is currently available.";

    } catch (error) {
        statusMessage.textContent =
            "⚠ Unable to load prices. Please check your internet connection and try again.";

    } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Refresh Prices";
    }
}

refreshButton.addEventListener("click", updateMarket);

updateMarket();
</script>

</body>
</html>
```

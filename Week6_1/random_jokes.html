
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funny Joke Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            color: #4338ca;
            margin-bottom: 10px;
        }

        header p {
            color: #64748b;
        }

        .joke-card, .favorites {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .joke-card {
            text-align: center;
            border-top: 5px solid #6366f1;
        }

        .joke-card h2 {
            margin-bottom: 25px;
            color: #334155;
        }

        #setup {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        #punchline {
            display: none;
            background: #eef2ff;
            color: #4338ca;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            line-height: 1.5;
        }

        .loading {
            display: none;
            color: #6366f1;
            margin: 20px 0;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #e0e7ff;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover:not(:disabled) {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .load-btn {
            background: #4f46e5;
            color: white;
        }

        .save-btn {
            background: #fbbf24;
            color: #422006;
        }

        .clear-btn {
            background: #fee2e2;
            color: #dc2626;
            padding: 7px 12px;
        }

        .favorites h2 {
            margin-bottom: 20px;
            color: #334155;
        }

        .favorite-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .favorite-item p:first-child {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .favorite-item p:last-child {
            color: #4f46e5;
        }

        .delete-btn {
            background: transparent;
            color: #dc2626;
            font-size: 20px;
            padding: 0 8px;
        }

        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translate(-50%, 100px);
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: 0.3s;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .joke-card, .favorites {
                padding: 20px;
            }

            header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>😂 Joke Generator</h1>
        <p>Get a random joke and make your day fun!</p>
    </header>

    <div class="error" id="errorBox">
        Unable to load a joke. Please check your internet connection.
    </div>

    <main class="joke-card">

        <h2>Here's Your Joke!</h2>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Please wait...
        </div>

        <div id="jokeArea">
            <p id="setup">Click the button to discover a random joke!</p>
            <p id="punchline"></p>
        </div>

        <div class="buttons">
            <button class="load-btn" id="loadBtn">
                Get New Joke
            </button>

            <button class="save-btn" id="saveBtn" disabled>
                ★ Save Joke
            </button>
        </div>

    </main>

    <section class="favorites">

        <h2>
            ★ My Favourite Jokes
            (<span id="total">0</span>)
        </h2>

        <button class="clear-btn" id="clearBtn" style="display:none;">
            Clear All
        </button>

        <div id="favoriteList"></div>

        <p class="empty" id="emptyMessage">
            No favourite jokes yet. Save a joke you like!
        </p>

    </section>

</div>

<div class="toast" id="toast"></div>


<script>

    // Selecting HTML elements
    const loadBtn = document.getElementById("loadBtn");
    const saveBtn = document.getElementById("saveBtn");
    const setup = document.getElementById("setup");
    const punchline = document.getElementById("punchline");
    const loading = document.getElementById("loading");
    const jokeArea = document.getElementById("jokeArea");
    const errorBox = document.getElementById("errorBox");
    const favoriteList = document.getElementById("favoriteList");
    const emptyMessage = document.getElementById("emptyMessage");
    const total = document.getElementById("total");
    const clearBtn = document.getElementById("clearBtn");
    const toast = document.getElementById("toast");

    // Application variables
    let activeJoke = null;

    let savedJokes = JSON.parse(
        localStorage.getItem("myJokes")
    ) || [];


    // Display notification
    function notify(message) {
        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);
    }


    // Get random joke from API
    async function getJoke() {

        loading.style.display = "block";
        jokeArea.style.display = "none";
        errorBox.style.display = "none";

        loadBtn.disabled = true;
        saveBtn.disabled = true;

        try {

            const response = await fetch(
                "https://official-joke-api.appspot.com/random_joke"
            );

            if (!response.ok) {
                throw new Error("Something went wrong!");
            }

            const jokeData = await response.json();

            activeJoke = {
                id: jokeData.id,
                setup: jokeData.setup,
                punchline: jokeData.punchline
            };

            setup.textContent = jokeData.setup;
            punchline.textContent = jokeData.punchline;

            punchline.style.display = "block";
            saveBtn.disabled = false;

        } catch (error) {

            console.log(error);

            activeJoke = null;
            errorBox.style.display = "block";
            punchline.style.display = "none";

        } finally {

            loading.style.display = "none";
            jokeArea.style.display = "block";
            loadBtn.disabled = false;

        }
    }


    // Save current joke
    function saveJoke() {

        if (!activeJoke) return;

        const duplicate = savedJokes.some(
            joke => joke.id === activeJoke.id
        );

        if (duplicate) {
            notify("This joke is already saved!");
            return;
        }

        savedJokes.unshift(activeJoke);

        localStorage.setItem(
            "myJokes",
            JSON.stringify(savedJokes)
        );

        displayFavorites();
        notify("Joke saved successfully!");
    }


    // Display saved jokes
    function displayFavorites() {

        favoriteList.innerHTML = "";

        total.textContent = savedJokes.length;

        if (savedJokes.length === 0) {

            emptyMessage.style.display = "block";
            clearBtn.style.display = "none";
            return;

        }

        emptyMessage.style.display = "none";
        clearBtn.style.display = "inline-block";

        savedJokes.forEach((joke, index) => {

            const item = document.createElement("div");
            item.className = "favorite-item";

            const content = document.createElement("div");

            const question = document.createElement("p");
            question.textContent = joke.setup;

            const answer = document.createElement("p");
            answer.textContent = joke.punchline;

            content.appendChild(question);
            content.appendChild(answer);

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "×";
            deleteBtn.className = "delete-btn";

            deleteBtn.addEventListener("click", () => {
                removeJoke(index);
            });

            item.appendChild(content);
            item.appendChild(deleteBtn);

            favoriteList.appendChild(item);

        });
    }


    // Remove an individual favourite
    function removeJoke(index) {

        savedJokes.splice(index, 1);

        localStorage.setItem(
            "myJokes",
            JSON.stringify(savedJokes)
        );

        displayFavorites();
        notify("Joke removed!");
    }


    // Remove all favourites
    function clearFavorites() {

        if (confirm("Are you sure you want to delete all jokes?")) {

            savedJokes = [];

            localStorage.removeItem("myJokes");

            displayFavorites();

            notify("All favourites deleted!");

        }
    }


    // Button event listeners
    loadBtn.addEventListener("click", getJoke);
    saveBtn.addEventListener("click", saveJoke);
    clearBtn.addEventListener("click", clearFavorites);


    // Display previously saved jokes
    displayFavorites();

</script>

</body>
</html>

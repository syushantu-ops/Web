
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 10_1 - Portfolio Assignment</title>

    <style>
        :root {
            --bg: #0b1020;
            --card: #151d33;
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --text: #f1f5f9;
            --muted: #a5b4c8;
            --line: #293653;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #31215c, transparent 40%),
                radial-gradient(circle at bottom right, #103c55, transparent 40%),
                var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .card {
            width: min(760px, 100%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px var(--shadow);
        }

        .header {
            position: relative;
            padding: 42px 36px;
            background: linear-gradient(120deg, #6d28d9, #2563eb, #0891b2);
            overflow: hidden;
        }

        .header::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -45px;
            top: -65px;
            border: 25px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
        }

        .tag {
            display: inline-block;
            padding: 7px 15px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .content {
            padding: 36px;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 1rem;
        }

        .repo-box {
            margin-top: 26px;
            padding: 26px;
            background: #1c2944;
            border: 1px solid var(--line);
            border-radius: 18px;
            transition: border-color 0.3s ease, transform 0.3s ease;
        }

        .repo-box:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
        }

        .repo-box h2 {
            margin: 0 0 12px;
            color: #c4b5fd;
            font-size: 1.3rem;
        }

        .repo-box p {
            margin-bottom: 10px;
        }

        .repo-link,
        .live-link {
            display: inline-block;
            margin-top: 14px;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .repo-link {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
        }

        .live-link {
            margin-left: 8px;
            background: transparent;
            border: 1px solid var(--secondary);
            color: #67e8f9;
        }

        .repo-link:hover,
        .live-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.2);
        }

        .live-link:hover {
            background: rgba(6, 182, 212, 0.12);
        }

        @media (max-width: 550px) {
            .header {
                padding: 32px 24px;
            }

            .content {
                padding: 25px 20px;
            }

            .repo-box {
                padding: 20px;
            }

            .repo-link,
            .live-link {
                display: block;
                margin: 12px 0 0;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <header class="header">
            <div class="tag">Week 10 · Part 1</div>
            <h1>Portfolio Assignment</h1>
        </header>

        <section class="content">
            <p>
                This assignment is linked to the portfolio repository provided for Week 10_1.
            </p>

            <div class="repo-box">
                <h2>Repository</h2>
                <p>GitHub: syushantu-ops/portfolio</p>

                <a class="repo-link"
                   href="https://github.com/syushantu-ops/portfolio"
                   target="_blank"
                   rel="noreferrer">
                    Open Repository
                </a>

                <a class="live-link"
                   href="https://syushantu-ops.github.io/portfolio/"
                   target="_blank"
                   rel="noreferrer">
                    Open Live Page
                </a>
            </div>
        </section>
    </main>
</body>
</html>
